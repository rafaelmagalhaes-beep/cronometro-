<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronômetro de Palco - Campus Party</title>
  
  <!-- Configurações PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#265697">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cronômetro CP">

  <!-- Fontes Oficiais da Campus Party -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d17;
      font-family: 'Lato', sans-serif;
      color: #ffffff;
    }

    .setup-screen {
      background-image: url('1.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      position: absolute;
      top: 0;
      left: 0;
    }

    .setup-card {
      background: linear-gradient(135deg, rgba(20, 42, 82, 0.96) 0%, rgba(38, 86, 151, 0.95) 60%, rgba(0, 153, 255, 0.85) 100%);
      backdrop-filter: blur(10px);
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 0 35px rgba(0, 153, 255, 0.4), 0 0 20px rgba(254, 221, 0, 0.3);
      text-align: center;
      max-width: 560px;
      width: 90%;
      border: 2px solid #FEDD00;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .brand-logo-setup {
      max-width: 240px;
      width: 70%;
      margin-bottom: 0.3rem;
      filter: drop-shadow(0 0 12px rgba(254, 221, 0, 0.4));
    }

    .setup-card h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      color: #FEDD00;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(254, 221, 0, 0.6);
    }

    .config-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group label {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .input-group input[type="number"] {
      width: 90px;
      padding: 0.6rem;
      border-radius: 0.6rem;
      border: 2px solid #FEDD00;
      background-color: rgba(26, 56, 102, 0.9);
      color: #FEDD00;
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
    }

    .preset-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preset-title {
      font-size: 0.95rem;
      color: #e2e8f0;
      font-weight: 700;
    }

    .preset-btn {
      flex: 1;
      padding: 0.5rem;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      background-color: rgba(26, 56, 102, 0.9);
      color: #FEDD00;
      border: 1px solid #FEDD00;
      border-radius: 0.5rem;
      cursor: pointer;
    }

    .btn-notification {
      background: transparent;
      color: #FEDD00;
      border: 1px dashed #FEDD00;
      padding: 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .btn-start-presentation {
      width: 100%;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #FEDD00, #ffea60);
      color: #265697;
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: 900;
      border: none;
      border-radius: 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* TELA DO CRONÔMETRO */
    .timer-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      padding: 2rem;
      position: relative;
    }

    .brand-logo-timer {
      position: absolute;
      top: 2rem;
      max-width: 180px;
      width: 30vw;
    }

    body.theme-normal .timer-screen { background-color: #265697; }
    body.theme-perguntas .timer-screen { background-color: #0099FF; }
    body.theme-10min .timer-screen { background-color: #FF6B00; }
    body.theme-5min .timer-screen { background-color: #FEDD00; }
    body.theme-final .timer-screen { background-color: #D32F2F; }

    .status-alert {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      padding: 0.8rem 2rem;
      border-radius: 1rem;
      margin-top: 3rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .status-normal { background-color: rgba(26, 56, 102, 0.9); color: #FEDD00; border: 2px solid #FEDD00; }
    .status-perguntas { background-color: #265697; color: #ffffff; border: 2px solid #ffffff; }
    .status-10min { background-color: #ffffff; color: #FF6B00; }
    .status-5min { background-color: #265697; color: #FEDD00; }
    .status-final { background-color: #ffffff; color: #D32F2F; }

    .display-giant {
      font-size: 24vw;
      font-weight: 900;
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      line-height: 0.9;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      margin-bottom: 2rem;
    }

    .floating-controls {
      position: absolute;
      bottom: 2rem;
      display: flex;
      gap: 1rem;
    }

    .floating-btn {
      font-family: 'Poppins', sans-serif;
      padding: 0.8rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 700;
      border: 2px solid #FEDD00;
      border-radius: 0.6rem;
      cursor: pointer;
      background-color: rgba(38, 86, 151, 0.9);
      color: #FEDD00;
    }
  </style>
</head>
<body class="theme-normal">

  <!-- 1. TELA DE CONFIGURAÇÃO (SET) -->
  <div id="setupScreen" class="setup-screen">
    <div class="setup-card">
      <img src="LOGO_CP-BRASIL_BRANCO..png" alt="Campus Party Brasil" class="brand-logo-setup">
      <h1>Cronômetro de Palco</h1>

      <div class="config-panel">
        <div class="input-group">
          <label for="minutes">Tempo Total (min):</label>
          <input type="number" id="minutes" min="1" max="300" value="30">
        </div>

        <div class="preset-container">
          <span class="preset-title">Atalhos:</span>
          <button class="preset-btn" onclick="setPreset(15)">15m</button>
          <button class="preset-btn" onclick="setPreset(30)">30m</button>
          <button class="preset-btn" onclick="setPreset(45)">45m</button>
          <button class="preset-btn" onclick="setPreset(60)">60m</button>
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255, 255, 255, 0.2);">

        <div class="input-group">
          <label for="questionMinutes">Perguntas (min rest.):</label>
          <input type="number" id="questionMinutes" min="1" max="300" value="15">
        </div>

        <button id="btnAllowNotify" class="btn-notification">🔔 Ativar Notificações no Celular</button>
      </div>

      <button id="btnStartSetup" class="btn-start-presentation">🚀 Iniciar Apresentação</button>
    </div>
  </div>

  <!-- 2. TELA PRINCIPAL DO CRONÔMETRO -->
  <div id="timerScreen" class="timer-screen">
    <img src="LOGO_CP-BRASIL_BRANCO..png" alt="Campus Party Brasil" class="brand-logo-timer">

    <div id="status" class="status-alert status-normal">Aguardando Início</div>
    <div id="display" class="display-giant">30:00</div>

    <div class="floating-controls">
      <button id="btnStartMain" class="floating-btn">▶️ Iniciar</button>
      <button id="btnPause" class="floating-btn" disabled>⏸️ Pausar</button>
      <button id="btnReset" class="floating-btn">🔄 Reiniciar</button>
      <button id="btnSettings" class="floating-btn">⚙️ Ajustes</button>
    </div>
  </div>

  <script>
    // Registrar o Service Worker para PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }

    let timer = null;
    let totalSeconds = 0;
    let isPaused = false;
    let notifiedPerguntas = false;
    let notified10m = false;
    let notified5m = false;

    const setupScreen = document.getElementById('setupScreen');
    const timerScreen = document.getElementById('timerScreen');
    const display = document.getElementById('display');
    const status = document.getElementById('status');
    const inputMinutes = document.getElementById('minutes');
    const inputQuestionMinutes = document.getElementById('questionMinutes');
    const btnAllowNotify = document.getElementById('btnAllowNotify');
    
    const btnStartSetup = document.getElementById('btnStartSetup');
    const btnStartMain = document.getElementById('btnStartMain');
    const btnPause = document.getElementById('btnPause');
    const btnReset = document.getElementById('btnReset');
    const btnSettings = document.getElementById('btnSettings');
    const body = document.body;

    // Pedir permissão para notificações
    btnAllowNotify.addEventListener('click', () => {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            btnAllowNotify.textContent = '✅ Notificações Ativadas!';
            btnAllowNotify.style.borderColor = '#4CAF50';
            btnAllowNotify.style.color = '#4CAF50';
          }
        });
      }
    });

    // Função de Notificação do Celular
    function sendPushNotification(title, message) {
      if ('Notification' in window && Notification.permission === 'granted') {
        navigator.serviceWorker.ready.then(registration => {
          registration.showNotification(title, {
            body: message,
            icon: 'LOGO_CP-BRASIL_BRANCO..png',
            vibrate: [200, 100, 200, 100, 200],
            tag: 'stage-timer'
          });
        });
      }
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function checkAlerts() {
      const questionSecs = (parseInt(inputQuestionMinutes.value) || 0) * 60;

      if (totalSeconds === 0) {
        status.textContent = "⏱️ Tempo Esgotado!";
        status.className = "status-alert status-final";
        body.className = "theme-final";
      } else if (totalSeconds <= 300) { 
        status.textContent = "⚠️ Faltam 5 Minutos!";
        status.className = "status-alert status-5min";
        body.className = "theme-5min";

        if (!notified5m) {
          sendPushNotification("⚠️ Campus Party - Palco", "Atenção: Restam apenas 5 minutos!");
          notified5m = true;
        }
      } else if (totalSeconds <= 600) { 
        status.textContent = "⌛ Faltam 10 Minutos!";
        status.className = "status-alert status-10min";
        body.className = "theme-10min";

        if (!notified10m) {
          sendPushNotification("⌛ Campus Party - Palco", "Faltam 10 minutos para encerrar!");
          notified10m = true;
        }
      } else if (totalSeconds <= questionSecs) { 
        status.textContent = "❓ Momento de Perguntas!";
        status.className = "status-alert status-perguntas";
        body.className = "theme-perguntas";

        if (!notifiedPerguntas) {
          sendPushNotification("❓ Campus Party - Palco", "Hora de abrir para as perguntas da plateia!");
          notifiedPerguntas = true;
        }
      } else {
        status.textContent = "Em Andamento";
        status.className = "status-alert status-normal";
        body.className = "theme-normal";
      }
    }

    function updateDisplay() {
      display.textContent = formatTime(totalSeconds);
      checkAlerts();
    }

    function startTimer() {
      if (!timer) {
        if (!isPaused) {
          const mins = parseInt(inputMinutes.value) || 0;
          if (mins <= 0) return;
          totalSeconds = mins * 60;
          notifiedPerguntas = false;
          notified10m = false;
          notified5m = false;
        }

        isPaused = false;
        btnStartMain.disabled = true;
        btnPause.disabled = false;

        timer = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateDisplay();
          } else {
            clearInterval(timer);
            timer = null;
            btnStartMain.disabled = false;
            btnPause.disabled = true;
            sendPushNotification("⏱️ FIM DE TEMPO!", "O tempo do palco encerrou completamente.");
          }
        }, 1000);
      }
    }

    function startFromSetup() {
      setupScreen.style.display = 'none';
      timerScreen.style.display = 'flex';
      startTimer();
    }

    function pauseTimer() {
      if (timer) {
        clearInterval(timer);
        timer = null;
        isPaused = true;
        btnStartMain.disabled = false;
        btnPause.disabled = true;
        status.textContent = "Pausado";
      }
    }

    function resetTimer() {
      clearInterval(timer);
      timer = null;
      isPaused = false;
      notifiedPerguntas = false;
      notified10m = false;
      notified5m = false;

      const mins = parseInt(inputMinutes.value) || 30;
      totalSeconds = mins * 60;

      display.textContent = formatTime(totalSeconds);
      status.textContent = "Aguardando Início";
      status.className = "status-alert status-normal";
      body.className = "theme-normal";

      btnStartMain.disabled = false;
      btnPause.disabled = true;
    }

    function showSettings() {
      resetTimer();
      timerScreen.style.display = 'none';
      setupScreen.style.display = 'flex';
    }

    function setPreset(minutes) {
      inputMinutes.value = minutes;
    }

    btnStartSetup.addEventListener('click', startFromSetup);
    btnStartMain.addEventListener('click', startTimer);
    btnPause.addEventListener('click', pauseTimer);
    btnReset.addEventListener('click', resetTimer);
    btnSettings.addEventListener('click', showSettings);
  </script>
</body>
</html>
